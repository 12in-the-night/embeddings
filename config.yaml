# ============================================================
# Multimodal MoE Embedding Model - Full Configuration
# ============================================================

# ---- Resume ----
# Path to a checkpoint to resume from (used when --resume is not given).
# Leave as null for a fresh start.
resume: null
# Examples:
#   resume: ./ckpts_pretrain/pretrain_final.pkl
#   resume: ./ckpts_pretrain/ckpt_005000.pkl

# ---- Phase ----
# pretrain  : mixed image-text + triplet data (image branch active)
# posttrain : text-only triplet data; image branch frozen (zero-grad)
phase: pretrain
data: mixed

# ---- Training ----
training:
  seq_len: 128
  batch: 128
  steps: 50000
  lr: 3.0e-4
  warmup: 1000
  min_lr_frac: 0.1
  weight_decay: 0.01      # positive = actual decay (L2 shrinkage)
  log_every: 50
  eval_every: 2000
  eval_batch: 512
  ckpt_every: 1000
  ckpt_dir: ./ckpts_pretrain
  grad_accum: 1
  remat: true
  precision: fp16         # fp16 | bf16 | fp32

# ---- Model ----
model:
  d_model: 512
  n_layers: 32
  mrl_dims: [64, 128, 256, 512]
  vocab_tok: mistralai/Mistral-7B-v0.1

mamba2:
  d_state: 128
  d_conv: 4
  chunk: 64
  expand: 2
  head_dim: 64

moe:
  n_experts: 32
  top_k: 2
  expert_ffn_mult: 0.5
  shared_ffn_mult: 1.0
  every: 2                # every Nth layer gets MoE (last of each group)
  layers: null            # or explicit list, e.g. [1, 3, 5, 7]; null = use every
  aux_lb_coef: 0.01
  aux_z_coef: 1.0e-3

qat:
  enabled: true
  bits: 4
  group_size: 128

image:
  size: 224
  patch: 16
  dim: 768
  layers: 8
  heads: 12
  mlp_mult: 4
  processor: google/vit-base-patch16-224

# Batch-source sampling weights. In posttrain phase image_text is forced to 0.
data_mix:
  image_text: 2         # requires HF_TOKEN for laion/laion400m
  msmarco_triplet: 3
  allnli_triplet: 1
  bekko_triplet: 2

optim:
  clip_norm: 1.0
  init_temp: 50.0

# ---- Postprocess ----
# NOTE: *_keep_ratio is the fraction KEPT, not pruned:
#   expert_keep_ratio: 0.75  -> keeps 24 of 32 experts (prunes 8).
postprocess:
  input_ckpt: ./ckpts_pretrain/pretrain_final.pkl
  output_dir: ./ckpts_compressed
  expert_keep_ratio: 0.75
  layer_keep_ratio: 0.75
  awq_alpha: 0.5
  awq_calib_batches: 32
  awq_calib_batch_size: 8
  export_bits: 4        # 4 = packed int4, 8 = int8
  export_group_size: 128
